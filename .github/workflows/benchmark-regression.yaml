name: Benchmark regression

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * 6"
  pull_request:
    paths:
      - "src/**"
      - "R/compute_ld.R"
      - "benchmarks/**"
      - ".github/workflows/benchmark-regression.yaml"

permissions:
  contents: read

jobs:
  medium-ld-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          dependencies: '"hard"'
          extra-packages: any::devtools

      - name: Run correctness and performance gate
        shell: Rscript {0}
        run: source("benchmarks/run_ld_benchmark.R", echo = TRUE)

      - name: Retain benchmark record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: medium-ld-benchmark
          path: benchmarks/results/current.csv
