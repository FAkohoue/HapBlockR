name: Benchmark regression

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * 6"
  pull_request:
    paths:
      - "src/**"
      - "R/compute_ld.R"
      - "benchmarks/**"
      - ".github/workflows/benchmark-regression.yaml"

permissions:
  contents: read

jobs:
  medium-ld-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2 # v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2 # v2
        with:
          extra-packages: any::devtools
          needs: check

      - name: Run correctness and performance gate
        shell: Rscript {0}
        run: source("benchmarks/run_ld_benchmark.R", echo = TRUE)

      - name: Retain benchmark record
        uses: actions/upload-artifact@v4 # v4
        with:
          name: medium-ld-benchmark
          path: benchmarks/results/current.csv
