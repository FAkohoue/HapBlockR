name: R-CMD-check

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  R-CMD-check:
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest,  r: "release"  }
          - { os: ubuntu-latest,  r: "devel"    }
          - { os: ubuntu-latest,  r: "oldrel-1" }
          # Fixed-version floor test, pinned to DESCRIPTION's Depends: R
          # (>= 4.3.0). Was previously "4.2" to match an R (>= 4.2.0) floor,
          # but ASRgenomics (Suggests) now transitively needs FactoMineR
          # (>= 2.13), which itself requires R >= 4.3 -- pak can no longer
          # resolve a full dependency lockfile (including Suggests) on R
          # 4.2 as a result. This is upstream CRAN drift in a third-party
          # transitive dependency, not a HapBlockR requirement, but it makes
          # R 4.2 no longer achievable for a full-Suggests CI install, so
          # the floor moved to 4.3 in both places together.
          - { os: ubuntu-22.04,   r: "4.3"      }
          # Pinned to macos-15 (not macos-latest): macos-latest now resolves
          # to macOS 26 "Tahoe", which dropped OpenGL/XQuartz support. `rgl`
          # (pulled in transitively via SimpleMating -> optiSel's dependency
          # tree) ships a compiled .so that dyn.load()s libGLU.1.dylib at
          # install time; that library no longer exists on Tahoe runners, so
          # `Install R dependencies` fails building SimpleMating from source
          # before any HapBlockR code is even touched. macos-15 predates the
          # OpenGL removal and is still a fully supported GitHub Actions
          # image (unlike macos-13/macos-14, which are being deprecated).
          - { os: macos-15,       r: "release"  }
          - { os: windows-latest, r: "release"  }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: true
      NOT_CRAN: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pandoc
        uses: r-lib/actions/setup-pandoc@v2 # v2

      - name: Set up R ${{ matrix.config.r }}
        uses: r-lib/actions/setup-r@v2 # v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libhdf5-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libgit2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libopenblas-dev \
            liblapack-dev \
            gfortran

      - name: Install XQuartz (macOS)
        if: runner.os == 'macOS'
        run: |
          # rgl (pulled in transitively via SimpleMating -> optiSel's
          # dependency tree) dlopen()s libGLU.1.dylib at package
          # install/lazy-load time. GitHub's macOS runner images do not
          # ship XQuartz (which provides libGLU) by default, so building
          # any package that loads rgl fails with "Library not loaded:
          # /opt/X11/lib/libGLU.1.dylib" even on non-Tahoe images like
          # macos-15. Installing XQuartz here (before "Install R
          # dependencies") puts libGLU.1.dylib on disk at the path rgl
          # already looks for it.
          brew install --cask xquartz

      - name: Install Bioconductor packages
        shell: Rscript {0}
        run: |
          if (!requireNamespace("BiocManager", quietly = TRUE))
            install.packages("BiocManager", repos = "https://cloud.r-project.org")
          BiocManager::install(ask = FALSE, update = FALSE)
          bioc_pkgs <- c("SNPRelate", "gdsfmt", "vsn")
          to_install <- bioc_pkgs[!vapply(
            bioc_pkgs,
            requireNamespace,
            logical(1L),
            quietly = TRUE
          )]
          if (length(to_install))
            BiocManager::install(to_install, ask = FALSE, update = FALSE)

      - name: Cache R packages
        uses: actions/cache@v4 # v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ matrix.config.r }}-${{ hashFiles('DESCRIPTION') }}
          restore-keys: |
            ${{ runner.os }}-r-${{ matrix.config.r }}-

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2 # v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::covr
          needs: check

      - name: Reinstall data.table from source on Linux
        if: runner.os == 'Linux'
        shell: Rscript {0}
        run: |
          if (requireNamespace("data.table", quietly = TRUE)) {
            try(remove.packages("data.table"), silent = TRUE)
          }
          install.packages("data.table", repos = "https://cloud.r-project.org", type = "source")
          library(data.table)
          packageVersion("data.table")

      - name: Check package
        uses: r-lib/actions/check-r-package@v2 # v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual")'
          args: 'c("--no-manual", "--as-cran", "--run-donttest")'

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4 # v4
        with:
          name: ${{ runner.os }}-r${{ matrix.config.r }}-results
          path: ${{ runner.os }}.Rcheck

  spelling-and-coverage:
    name: British spelling and decision coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2 # v2
        with:
          use-public-rspm: true

      - name: Set up dependencies
        uses: r-lib/actions/setup-r-dependencies@v2 # v2
        with:
          extra-packages: |
            any::covr
            any::spelling
            any::devtools
          needs: check

      - name: Check British-English spelling
        shell: Rscript {0}
        run: |
          errors <- spelling::spell_check_package()
          if (nrow(errors)) {
            print(errors)
            stop("Unrecognised package prose; update the text or inst/WORDLIST.")
          }

      - name: Measure decision-critical coverage
        shell: Rscript {0}
        run: |
          coverage <- covr::package_coverage(
            type = "tests",
            quiet = FALSE,
            clean = TRUE
          )
          coverage_data <- as.data.frame(coverage)
          critical <- grepl(
            "parent_selection|ocs|genomic_mating|core_collection|result_contract",
            coverage_data$filename
          )
          if (!any(critical))
            stop("No decision-critical source files were measured.")
          critical_data <- coverage_data[critical, , drop = FALSE]
          line_coverage <- stats::aggregate(
            value ~ filename + first_line,
            data = critical_data,
            FUN = sum
          )
          pct <- mean(line_coverage$value > 0) * 100
          print(pct)
          if (!is.finite(pct) || pct < 70)
            stop("Decision-critical line coverage is below 70%.")
