name: Compiled-code Valgrind

on:
  workflow_dispatch:
  schedule:
    - cron: "45 3 * * 0"
  pull_request:
    paths:
      - "src/**"
      - "R/compute_ld.R"
      - "tests/testthat/test-cpp.R"
      - "tests/testthat/test-compute-ld.R"
      - ".github/workflows/compiled-valgrind.yaml"

permissions:
  contents: read

jobs:
  valgrind:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
      _R_CHECK_USE_VALGRIND_: true
      VALGRIND_OPTS: "--leak-check=full --track-origins=yes --error-exitcode=1"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          use-public-rspm: true

      - name: Install Valgrind and build libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y valgrind libopenblas-dev liblapack-dev gfortran

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Build source package
        shell: Rscript {0}
        run: |
          pkg <- devtools::build(path = tempdir(), vignettes = FALSE)
          writeLines(pkg, "built-package-path.txt")

      - name: Check under Valgrind
        shell: bash
        run: |
          PKG="$(cat built-package-path.txt)"
          R CMD check --use-valgrind --no-manual "$PKG"
