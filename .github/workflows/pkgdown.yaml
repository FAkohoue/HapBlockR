name: pkgdown

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: write
  pages:    write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Pandoc
        uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          pandoc-version: "3.1.11"

      - name: Install R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev \
            zlib1g-dev libgit2-dev libhdf5-dev \
            libopenblas-dev liblapack-dev gfortran

      - name: Install Bioconductor packages
        shell: Rscript {0}
        run: |
          if (!requireNamespace("BiocManager", quietly = TRUE))
            install.packages("BiocManager", repos = "https://cloud.r-project.org")
          BiocManager::install(ask = FALSE, update = FALSE)
          # ASRgenomics' dependency graph also uses vsn. Installing all three
          # Bioconductor packages before pak resolves the website dependency
          # graph consistently with the successful R-CMD-check release lane.
          bioc_pkgs <- c("SNPRelate", "gdsfmt", "vsn")
          to_install <- bioc_pkgs[!vapply(bioc_pkgs, requireNamespace,
                                          logical(1L), quietly = TRUE)]
          if (length(to_install))
            BiocManager::install(to_install, ask = FALSE, update = FALSE)

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          extra-packages: any::pkgdown
          needs: website

      - name: Remove compiled artifacts
        run: |
          find . -type f \( \
            -name "*.o" -o \
            -name "*.obj" -o \
            -name "*.so" -o \
            -name "*.dll" -o \
            -name "*.a" -o \
            -name "*.lib" -o \
            -name "*.def" -o \
            -name "*.exp" -o \
            -name "*.dylib" \
          \) -print -delete
          rm -rf src-i386 src-x64 libs

      - name: Install HapBlockR
        # R CMD INSTALL is the only reliable way to get the package into
        # the default library so that library("HapBlockR") works in the
        # subsequent pkgdown step.  install.packages(".", repos=NULL) can
        # place the package in a non-default path that pkgdown cannot find.
        run: R CMD INSTALL --no-multiarch --with-keep.source .

      - name: Build pkgdown site
        env:
          PKGDOWN_DEV_MODE: release
        shell: Rscript {0}
        run: |
          pkgdown::build_site_github_pages(
            new_process = FALSE,
            install     = FALSE
          )

      - name: Publish the Breeder's Guide alongside the pkgdown site
        run: |
          guide_pdf="inst/extdata/HapBlockR_Breeder_Guide.pdf"
          guide_docx="inst/extdata/HapBlockR_Breeder_Guide.docx"

          for guide_file in "$guide_pdf" "$guide_docx"; do
            if [ ! -s "$guide_file" ]; then
              echo "Breeder's Guide file is missing or empty: $guide_file"
              exit 1
            fi
          done

          cp "$guide_pdf" docs/breeder-guide.pdf
          cp "$guide_docx" docs/breeder-guide.docx

          echo "Published breeder-guide.pdf and breeder-guide.docx"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url:  ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id:   deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
