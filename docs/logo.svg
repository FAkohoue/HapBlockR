<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">HapBlockR logo</title>
  <desc id="desc">A chromosome-inspired chain of coloured haplotype blocks surrounding the HapBlockR initials.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14324a"/>
      <stop offset="1" stop-color="#204f66"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#07141e" flood-opacity=".3"/>
    </filter>
  </defs>
  <rect x="24" y="24" width="592" height="592" rx="132" fill="url(#background)"/>
  <g fill="none" stroke-linecap="round" stroke-width="22" opacity=".98">
    <path d="M124 232 C190 134 270 140 320 220 C370 300 450 306 516 208" stroke="#72c7a1"/>
    <path d="M124 408 C190 506 270 500 320 420 C370 340 450 334 516 432" stroke="#f2b65b"/>
  </g>
  <g stroke="#f7fbfd" stroke-width="6">
    <rect x="113" y="207" width="58" height="58" rx="14" fill="#72c7a1"/>
    <rect x="213" y="159" width="58" height="58" rx="14" fill="#5aa9c6"/>
    <rect x="369" y="277" width="58" height="58" rx="14" fill="#aa8ed6"/>
    <rect x="469" y="181" width="58" height="58" rx="14" fill="#72c7a1"/>
    <rect x="113" y="383" width="58" height="58" rx="14" fill="#f2b65b"/>
    <rect x="213" y="431" width="58" height="58" rx="14" fill="#df7d68"/>
    <rect x="369" y="305" width="58" height="58" rx="14" fill="#aa8ed6"/>
    <rect x="469" y="405" width="58" height="58" rx="14" fill="#f2b65b"/>
  </g>
  <circle cx="320" cy="320" r="126" fill="#f7fbfd" filter="url(#shadow)"/>
  <text x="320" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="67" font-weight="700" fill="#14324a">HBR</text>
  <text x="320" y="358" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="600" letter-spacing="4" fill="#2d6a4f">BREEDING</text>
</svg>
