home:
  title: "HapBlockR -- Genome-Wide LD Block Detection"
  description: >
    Fast, scalable LD block detection using r2 or kinship-adjusted rV2,
    with C++/Armadillo acceleration, multi-format I/O, and a
    never-full-genome memory model. WGS-scale acceleration via Louvain/Leiden
    community detection (polynomial-time, no clique blowup), sparse LD
    computation (max_bp_distance), and a bigmemory file-backed matrix store.
    Complete downstream pipeline: haplotype analysis (phased and unphased),
    diversity metrics, post-GWAS QTL mapping, single and multi-trait
    haplotype-based genomic prediction (rrBLUP per trait, shared GRM),
    three-evidence block ranking for haplotype stacking, and cross-population
    effect concordance from haplotype association results (compare_block_effects)
    or any external GWAS tool (compare_gwas_effects, with automatic SE derivation
    from z-score and block_match = "position" for populations with different
    LD block boundaries). Epistasis detection module: within-block pairwise SNP
    interaction scan with Bonferroni and simpleM Sidak correction
    (scan_block_epistasis), trans-haplotype between-block epistasis scan
    (scan_block_by_block_epistasis), and single-block fine-mapping with pairwise
    or LASSO dispatch (fine_map_epistasis_block).
  links:
    - text: Browse source code
      href: https://github.com/FAkohoue/HapBlockR
    - text: Report a bug
      href: https://github.com/FAkohoue/HapBlockR/issues
